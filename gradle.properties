# Gradle
org.gradle.jvmargs=-Xmx2G
# This machine's default JDK is 25, which Gradle 8.8 / Loom can't run under.
# Pin the build to JDK 17. (Machine-specific — adjust if your JDK 17 lives elsewhere.)
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17

# Mod Properties
mod_version=0.4.0 (Alpha)
maven_group=com.ViveTacZ
archives_base_name=ViveTacZ

# Minecraft / Fabric — 1.20.1 to match TaCZ Refabricated + the Vivecraft jar
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.3
fabric_version=0.92.2+1.20.1

# Vivecraft target (reflection only — not a compile dependency)
vivecraft_version=1.20.1-1.3.9-fabric

# LWJGL (for OpenVR — must match what Vivecraft bundles)
lwjgl_version=3.3.2
